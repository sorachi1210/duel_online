<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デュエマ対戦テーブル 試作版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">PRIVATE PLAYTEST PROTOTYPE</p>
      <h1>対戦テーブル <span>β</span></h1>
    </div>
    <div id="connection" class="pill">未接続</div>
  </header>

  <main>
    <section id="lobby" class="panel">
      <h2>ルームに参加</h2>
      <label>プレイヤー名<input id="playerName" maxlength="24" placeholder="名前を入力"></label>
      <div class="actions">
        <button id="createBtn">ルームを作る</button>
        <div class="joinline">
          <input id="roomCode" maxlength="6" placeholder="ルームコード">
          <button id="joinBtn" class="secondary">参加</button>
        </div>
      </div>
      <p class="hint">2人で同じルームコードを使って参加してください。</p>
      <p id="lobbyMessage" class="message"></p>
    </section>

    <section id="game" hidden>
      <div class="gamebar panel">
        <div><span class="muted">ルーム</span> <strong id="roomLabel">------</strong></div>
        <div><span class="muted">ターン</span> <strong id="turnLabel">0</strong></div>
        <div id="turnStatus">相手の参加を待っています</div>
        <button id="passBtn" class="secondary">ターン終了</button>
      </div>

      <section class="panel opponent">
        <div class="player-heading"><h2 id="opponentName">相手</h2><span>相手のゾーン</span></div>
        <div class="zones opponent-zones" id="opponentZones"></div>
      </section>

      <section class="panel add-card">
        <h2>カードを追加 <span class="small">手動テスト用</span></h2>
        <div class="card-form">
          <label>カード名<input id="cardName" maxlength="60" placeholder="例：カード名"></label>
          <label>コスト<input id="cardCost" type="number" min="0" max="99" value="2"></label>
          <label>追加先<select id="cardZone">
            <option value="hand">手札</option><option value="deck">山札</option><option value="mana">マナ</option>
            <option value="shield">シールド</option><option value="battle">バトルゾーン</option><option value="graveyard">墓地</option>
          </select></label>
          <button id="addCardBtn">追加</button>
        </div>
        <p class="hint">この試作版はカード名などを手入力します。公式画像やカードデータは同梱していません。</p>
      </section>

      <section class="panel">
        <div class="player-heading"><h2 id="myName">自分のゾーン</h2><span>カードを選択して移動</span></div>
        <div class="zones" id="myZones"></div>
        <div class="move-form">
          <label>選択中のカード <strong id="selectedCard">未選択</strong></label>
          <label>移動先<select id="moveTo">
            <option value="hand">手札</option><option value="deck">山札</option><option value="mana">マナ</option>
            <option value="shield">シールド</option><option value="battle">バトルゾーン</option><option value="graveyard">墓地</option>
          </select></label>
          <button id="moveBtn" class="secondary">カードを移動</button>
        </div>
      </section>

      <section class="panel">
        <h2>対戦ログ</h2>
        <ol id="log"></ol>
      </section>
    </section>
    <footer>非公式の個人用試作ツール。公式サービスではありません。対戦ルールやカード効果の自動処理は未実装です。</footer>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
